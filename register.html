<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <style>
    :root {
      --bg: #0f172a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 18% 22%, rgba(34, 197, 94, 0.14), transparent 32%),
                  radial-gradient(circle at 88% 80%, rgba(59, 130, 246, 0.12), transparent 30%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input:focus {
      outline: none;
      border-color: rgba(34, 197, 94, 0.6);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }

    .terms {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: var(--muted);
      font-size: 14px;
      margin: 8px 0 18px;
    }

    .submit {
      width: 100%;
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      color: #0b1120;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 12px 30px rgba(34, 197, 94, 0.35);
    }

    .submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 34px rgba(34, 197, 94, 0.45);
    }

    .submit:active {
      transform: translateY(0);
      box-shadow: 0 10px 26px rgba(34, 197, 94, 0.32);
    }

    .footer {
      margin-top: 14px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .link:hover {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Sign up to unlock secure dashboards, faster workflows, and proactive alerts.</p>

    <form>
      <div class="grid">
        <div>
          <label for="firstName">First name</label>
          <input class="input" type="text" id="firstName" name="firstName" placeholder="Jane" required />
        </div>
        <div>
          <label for="lastName">Last name</label>
          <input class="input" type="text" id="lastName" name="lastName" placeholder="Doe" required />
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="phone">Phone</label>
          <input class="input" type="tel" id="phone" name="phone" placeholder="(+91) 98765 43210" />
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="••••••••" minlength="8" required />
        </div>
        <div>
          <label for="confirmPassword">Confirm password</label>
          <input class="input" type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" minlength="8" required />
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" required />
        <span>I agree to the Terms of Service and acknowledge the Privacy Policy.</span>
      </label>

      <button class="submit" type="submit">Sign up</button>
    </form>

    <p class="footer">
      Already have an account?
      <a class="link" href="login.html">Log in</a>
    </p>
  </main>
</body>
</html>
